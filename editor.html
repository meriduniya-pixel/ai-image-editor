<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified AI Workspace - CreateForge AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/global.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Unified Top Bar Nav -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-4 z-20">
    <div class="flex items-center space-x-3">
      <a href="dashboard.html" class="flex items-center space-x-2 text-indigo-500 font-bold">
        <i data-lucide="wand-2" class="w-5 h-5"></i>
        <span>CreateForge</span>
      </a>
      <span class="text-slate-600">/</span>
      <input type="text" id="projectTitle" value="Untitled Creation" class="bg-transparent text-sm text-slate-200 font-medium focus:outline-none focus:border-b border-indigo-500 px-1 py-0.5">
      <span id="saveState" class="text-xs text-slate-500 italic">Saved ✓</span>
    </div>

    <div class="flex items-center space-x-3">
      <div class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-1.5">
        <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i>
        <span class="text-slate-400">Credits:</span>
        <span id="workspaceCreditsDisplay" class="font-bold text-amber-400">...</span>
      </div>

      <button id="exportBtn" class="btn-primary text-xs flex items-center space-x-1 py-1.5 px-3">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>Export</span>
      </button>
    </div>
  </header>

  <!-- Workspace Structural Layout -->
  <div class="flex flex-1 h-[calc(100vh-3.5rem)] overflow-hidden">
    
    <!-- Left Workspace Selector Panel -->
    <aside class="w-16 border-r border-slate-800 bg-slate-900/50 flex flex-col items-center py-4 space-y-6">
      <button onclick="Editor.switchMode('image')" class="p-2.5 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-indigo-400 active-mode" title="AI Image Studio">
        <i data-lucide="image" class="w-5 h-5"></i>
      </button>
      <button onclick="Editor.switchMode('writer')" class="p-2.5 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-indigo-400" title="AI Writer">
        <i data-lucide="file-text" class="w-5 h-5"></i>
      </button>
      <button onclick="Editor.switchMode('pdf')" class="p-2.5 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-indigo-400" title="PDF Studio">
        <i data-lucide="file-type-2" class="w-5 h-5"></i>
      </button>
      <button onclick="Editor.switchMode('ppt')" class="p-2.5 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-indigo-400" title="Presentation Maker">
        <i data-lucide="presentation" class="w-5 h-5"></i>
      </button>
    </aside>

    <!-- Contextual Control Sidebar -->
    <aside class="w-80 border-r border-slate-800 bg-slate-900/30 p-4 flex flex-col justify-between overflow-y-auto">
      <div class="space-y-4">
        <h3 id="modeTitle" class="text-sm font-bold uppercase tracking-wider text-slate-400">Image Generator</h3>
        
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Prompt Command</label>
          <textarea id="aiPromptInput" rows="4" placeholder="Describe what you want to create..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition"></textarea>
        </div>

        <div id="dynamicControls" class="space-y-3">
          <!-- Dynamic Form Elements Rendered via JavaScript -->
        </div>
      </div>

      <button id="generateBtn" onclick="Editor.executeGeneration()" class="w-full btn-primary mt-4 py-2.5 text-xs flex items-center justify-center space-x-2">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span>Generate Target</span>
      </button>
    </aside>

    <!-- Main Output / Viewport Canvas -->
    <main class="flex-1 bg-slate-950 p-6 flex flex-col items-center justify-center relative overflow-auto">
      
      <div id="emptyState" class="text-center max-w-sm">
        <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mx-auto mb-3 text-slate-500">
          <i data-lucide="layout" class="w-6 h-6"></i>
        </div>
        <p class="text-slate-400 text-sm font-medium">Your creation canvas is empty</p>
        <p class="text-slate-600 text-xs mt-1">Enter a prompt on the left and click Generate to start forging content.</p>
      </div>

      <!-- Execution Progress State -->
      <div id="processingState" class="hidden text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500 mb-3"></div>
        <p id="progressStatus" class="text-sm font-medium text-indigo-400">Processing request...</p>
        <p class="text-xs text-slate-500 mt-1">Calling serverless AI orchestration pipeline</p>
      </div>

      <!-- Main Preview Stage -->
      <div id="stageViewport" class="hidden w-full h-full flex items-center justify-center">
        <img id="imageOutput" class="max-h-full max-w-full rounded-lg shadow-2xl border border-slate-800 object-contain hidden">
        <div id="textOutput" class="w-full h-full max-w-2xl bg-slate-900 border border-slate-800 rounded-xl p-6 overflow-y-auto hidden text-slate-200 text-sm leading-relaxed"></div>
      </div>

    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/editor.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
